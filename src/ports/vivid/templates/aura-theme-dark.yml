#
# {{ displayName }} > Dark color scheme
# Repository: {{{ repository }}}
# Theme version: {{ version }}
#
# Color names reference the accent naming convention from aura-theme/src/core/colors/schemes/

colors:
  # Primary colors
  accent0: '{{ accent0 }}' # dark accent
  accent1: '{{ accent1 }}' # purple
  accent2: '{{ accent2 }}' # green/cyan
  accent3: '{{ accent3 }}' # orange
  accent4: '{{ accent4 }}' # lime
  accent5: '{{ accent5 }}' # red
  accent6: '{{ accent6 }}' # pink
  accent7: '{{ accent7 }}' # foreground
  accent8: '{{ accent8 }}' # comments
  accent32: '{{ accent32 }}' # blue

  # UI colors
  accent9: '{{ accent9 }}' # lighter foreground
  accent10: '{{ accent10 }}' # medium foreground
  accent13: '{{ accent13 }}' # dark gray
  accent15: '{{ accent15 }}' # medium gray
  accent22: '{{ accent22 }}' # selection
  accent23: '{{ accent23 }}' # darker selection
  accent25: '{{ accent25 }}' # accent teal
  accent28: '{{ accent28 }}' # darker background

  # Darker variants
  accent11: '{{ accent11 }}' # black
  accent12: '{{ accent12 }}' # background
  accent21: '{{ accent21 }}' # darker background
  accent24: '{{ accent24 }}' # darkest background

core:
  normal_text:
    foreground: accent8

  regular_file:
    foreground: accent7

  reset_to_normal:
    foreground: accent8

  directory:
    foreground: accent1
    font-style: bold

  executable_file:
    foreground: accent2
    font-style: bold

  file_with_capability:
    foreground: accent7
    background: accent23
    font-style:
      - bold
      - underline

  setuid:
    foreground: accent7
    background: accent5

  setgid:
    foreground: accent11
    background: accent3

  sticky:
    foreground: accent7
    background: accent1

  sticky_other_writable:
    foreground: accent11
    background: accent1
    font-style: bold

  other_writable:
    foreground: accent1
    background: accent23
    font-style: bold

  symlink:
    foreground: accent32
    font-style: italic

  broken_symlink:
    foreground: accent11
    background: accent5

  missing_symlink_target:
    foreground: accent5

  multi_hard_link:
    foreground: accent32
    font-style: underline

  socket:
    foreground: accent6
    background: accent28
    font-style: bold

  fifo:
    foreground: accent3
    background: accent28
    font-style: bold

  door:
    foreground: accent2
    background: accent28
    font-style: bold

  block_device:
    foreground: accent5
    background: accent21
    font-style: bold

  character_device:
    foreground: accent3
    background: accent21
    font-style: bold

executable:
  foreground: accent2
  font-style: bold

archives:
  foreground: accent5
  font-style: bold

  images:
    foreground: accent3
    font-style: bold

media:
  audio:
    foreground: accent32
    font-style: bold

  image:
    foreground: accent6
    font-style: bold

  video:
    foreground: accent5
    font-style: bold

  fonts:
    foreground: accent3
    font-style: bold

  3d:
    foreground: accent6
    font-style: bold

office:
  foreground: accent4
  font-style: bold

text:
  foreground: accent7

  configuration:
    foreground: accent3

    dockerfile:
      foreground: accent32

  licenses:
    foreground: accent8
    font-style: italic

  special:
    foreground: accent32
    font-style: bold

  todo:
    foreground: accent3
    font-style: bold

markup:
  foreground: accent3

programming:
  foreground: accent2

  source:
    foreground: accent2

  tooling:
    foreground: accent32

    continuous-integration:
      foreground: accent25

unimportant:
  foreground: accent8
  font-style: italic
